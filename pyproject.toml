[project]
name = "ai-tutor"
version = "0.1.0"
description = "Local, voice-enabled AI tutor (CBSE, all subjects, Class 3-10, English) running fully offline on MacBook M2."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.1",
    "langgraph>=0.2.0",
    "langchain-ollama>=0.2.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "whispercpp>=0.0.17",
    "silero-vad>=5.1",
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "torch>=2.2.0",
    "kokoro>=0.7.0",
    "alembic>=1.13.0",
    "greenlet>=3.5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app", "agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "fixture_file(filename): path to a recorded TutorResponse fixture JSON file relative to tests/fixtures/",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-assume>=2.4.3",
    "pytest-asyncio==0.25.1",
]
